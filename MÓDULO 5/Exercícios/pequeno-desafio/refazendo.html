<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    #conteiner {
        height: 100vh;
        width: 100vw;
        display: grid;
        grid-template:80px 40px 1fr 40px / 1fr 150px;
        gap: 5px;
        text-align: center;
    }

    .topo {
        background-color: lightcoral;
        grid-area: 1 / 1 / 2 / -1;
    }
    .menu {
        background-color: lightblue;
        grid-area: 2/ 1 / 3 / -1 ;
    }
    .main {
        background-color: lightgreen;
        grid-area: 3 / 1 / 4 / 2;
    }
    .sec {
        background-color: lightgoldenrodyellow;
        grid-area: 3 / 2 / 4 / -1;
    }
    .footer {
        color: white;
        background-color: black;
        grid-area: 4 / 1 / 5 / -1;
    }
</style>
<body>
    <div id="conteiner">
        <div class="topo">Topo</div>
        <div class="menu">menu</div>
        <div class="main">principal</div>
        <div class="sec">secundário</div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
