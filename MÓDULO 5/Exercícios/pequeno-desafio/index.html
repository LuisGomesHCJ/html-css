<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    #conteiner {
        display: grid;
        grid-template: repeat(9, auto) / repeat(2, 1fr);
        gap: 5px;
    }
    .topo {
        height: 130px;
        background-color: lightblue;
        grid-row: 1 / 2;
        grid-column: 1 / 3;
        
    }
    .menu {
        height: 90px;
        background-color: lightgreen;
        grid-area: 2 / 1 / 3 / 3;
    }
    .main {
        min-width: 600px;
        height: 734px;
        background-color: lightcoral;
        grid-row: 3 / 9;
        grid-column: 1 / 2;
    }
    .sec {
        grid-area: 3 / 2 / 9 / 3; 
        background-color: lightgoldenrodyellow;
    }
    .footer {
        height: 50px;
        color: white;
        background-color: black;
        grid-row: 9 / 10;
        grid-column: 1 / 3;
    }
</style>
<body>
    <div id="conteiner">
        <div class="topo">Topo</div>
        <div class="menu">menu</div>
        <div class="main">principal</div>
        <div class="sec">secundário</div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
