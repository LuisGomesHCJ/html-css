<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body, html {
            font-family: Arial, Helvetica, sans-serif;
        }


        header {
            display: flex;
            background-color: blue;
            height: 100px;
            padding: 15px;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15PX;
        }
        .logo {
            font-weight: bolder;
            font-size: 3em;
            background-color: red;
            border-radius: 20px;
            width: 150px;
            height: 70px;
        }
        nav a {
            font-weight: bold;
            color: blue;
            text-decoration: none;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
        }
        nav a:hover {
            background-color: lightpink;
            color: black;
            transition: .2s;
        }


        main {
            padding-left: 15px;
            display: grid;
            grid-template: repeat(3, 300px) / repeat(4, 1fr);
            background-color: teal;
        }
        section {
            background-color: purple;
            grid-row: 1 / -1;
            grid-column: 1 / -2;
        }
        article {
            background-color: white;
        }
        .anuncio {
            background-color: orange;
            grid-row: 1 / -1;
            grid-column: 4 / -1;
            
        }
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>
   <Header>
    <div class="logo">
        LOGO
    </div>
    <nav>
        <a href="#">Login</a>
        <a href="#">Notícias</a>
        <a href="#">Sobre nós</a>
    </nav>
   </Header>
   <main>
    <section>
        <article>
            <h1> APRENDENDO GRID LEYOUT</h1>
        </article>
    </section>
    <div class="anuncio">

    </div>
   </main>
   <footer>
    <p>Desenvolvido por Luis Gomes LTDA </p>
   </footer>
</body>
</html>
