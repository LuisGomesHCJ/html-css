<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        #conteiner {
            display: flex;
            flex-flow: row nowrap;
            background-color: lightblue;
            border: 1px solid black;
            padding: 15px;
            
            
        }
        .item {
            background-color: pink;
            border: 1px solid black;
            text-align: center;
            
            flex-basis: 250px;
            
        }

        #caixa1 {
            flex-shrink: 1;
            flex-grow: 1;
        }
        #caixa2 {
            flex-shrink: 1;
            flex-grow: 1;
        }   
        #caixa3 {
            flex-shrink:1;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="item" id="caixa1">A</div>
        <div class="item" id="caixa2">B</div>
        <div class="item" id="caixa3">C</div>
        
    </div>
</body>
</html>
