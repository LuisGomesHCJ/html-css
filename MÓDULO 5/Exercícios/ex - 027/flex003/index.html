<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        #conteiner {
            display: flex;
            /*
            flex-direction: row;
            flex-wrap: wrap; 
            */

            /* Short-hand - FLEX-FLOW
                1° flex-direction
                2° flex-wrap
            */
            flex-flow: row wrap;
            
            background-color: lightblue;
            border: 1px solid black;
            border-radius: 20px;
            padding: 10px;
            
            
            
        }
        .item {
            flex: auto;
            background-color: pink;
            border: 1px solid black;
            border-radius: 20px;
            text-align: center;
            height: 100px;
            width: 100px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
        <div class="item">Exemplo de Bloco G</div>
    </div>
</body>
</html>
