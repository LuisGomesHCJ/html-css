<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        #conteiner {
            display: flex;
            flex-flow: row wrap;

            background-color: lightblue;
            border: 1px solid black;
            
            
        }
        .item {
            
            background-color: pink;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="item">A</div>
        <div class="item">Conteúdo maior que a anterir </div>
        <div class="item">C</div>
        <div class="item">Lorem ipsum dolor sit, amet consectetur adipisicing elit. </div>
        <div class="item">E</div>
        <div class="item">Conteúdo maior que as anteriores, para demonstrar oq acontece com o flex-basis </div>
        <div class="item">G</div>
    </div>
</body>
</html>
