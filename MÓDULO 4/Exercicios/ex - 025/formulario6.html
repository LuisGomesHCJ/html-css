<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="Cadastro.php" method="get">
        <fieldset>
            <legend><strong>COR, NÍVEL E ARQUIVO</strong></legend>
            <p>
                <label for="icor">Escolha uma cor:</label>
                <input type="color" name="cor" id="icor">
            </p>
            <p>
                <label for="iniv">Qual o seu nível de Satisfação?</label>
                <input type="range" name="niv" id="iniv" min="1" max="5" value="1">
            </p>
            <p>
                <label for="ifoto">Escolha uma foto</label>
                <input type="file" name="foto" id="ifoto">
            </p>
            <input type="reset" value="Limpar dados">
            <input type="submit" value="Enviar">
        </fieldset>
    
    </form>
</body>
</html>
