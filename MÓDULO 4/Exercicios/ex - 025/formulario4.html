<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get">

        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required placeholder="Seu Nome" minlength="7" maxlength="20" autocomplete="name">
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" required placeholder="Seu E-mail" autocomplete="email">
            </p>
            <p>
                <label for="itelefone"> Telefone:</label>
                <input type="tel" name="telefone" id="itelefone" required placeholder="(xx) xxxx-xxxx" autocomplete="tel" title="Digite no formato (xx) xxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
                <!-- Estudar sobre RegEx para expressões regulares -->
            </p>
            <p>
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
            <p> 
                <input type="submit" value="Enviar Email">
            </p>
    </form>
</body>
</html>
