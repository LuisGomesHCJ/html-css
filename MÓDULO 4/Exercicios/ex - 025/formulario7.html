<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO</title>
</head>
<body>
    <h1>Formulários</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iestado">Seu Estado:</label>
            <select name="estado" id="iestado">
                <option value="" selected> Escolha um estado </option>
                <optgroup label="Região Sul">
                    <option value="PR">Paraná</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                </optgroup>
                <optgroup label="Nordeste">
                    <option value="PE">Pernambuco</option>
                    <option value="BA">Bahia</option>
                    <option value="AL">Alagoas</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraiba</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprofissao">Sua Profissão:</label>
            <input type="text" name="profissao" id="iprofissao" list="profissaolist">
            <datalist id="profissaolist">
                <option>Administrador</option>
                <option>Professor</option>
                <option>Advogado</option>
                <option>Desenvolvedor </option>
                <option>Contador</option>
                <option>Assistente Administrativo</option>
                <option>Gerente</option>
                <option>Operador</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Digite sua mensagem</label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite aqui... Você pode ampliar a caixa de mensagem no canto inferior direito."></textarea>
        </p>
</form>
</body>
</html>
