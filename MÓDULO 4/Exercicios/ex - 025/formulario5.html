<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">

        <fieldset>
            <legend>Gênero</legend>

            <input type="radio" name="gen" id="imasc" value="Masculino">
            <label for="imasc">Masculino</label> <br>

            <input type="radio" name="gen" id="ifem" value="Feminino">
            <label for="ifem">Feminino</label>

        </fieldset>
    
        <fieldset>
            <legend>Esportes favoritos</legend>

            <input type="checkbox" name="basq" id="ibasq">
            <label for="ibasq"> Basquete</label> <br>

            <input type="checkbox" name="fut" id="ifut">
            <label for="ifut">Futebool</label> <br>

            <input type="checkbox" name="volei" id="ivolei">
            <label for="ivolei">Vôlei</label> <br>

            <input type="checkbox" name="nat" id="inat">
            <label for="inat">Natação</label> <br>

            <input type="checkbox" name="tenis" id="itenis">
            <label for="itenis">Tênis</label> 

            <p>
                <label for="ioutro">Outro</label>
                <input type="text" name="outro" id="ioutro" placeholder="Qual?" minlength="8" maxlength="20" autocomplete="off">
            </p>

        </fieldset>

        <p>
            <input type="reset" value="Limpar dados">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
